  /HealthcareService/{id}:
    parameters:
    - in: path
      required: true
      name: id
      schema:
        type: string
    - name: _format
      in: query
      description: Serialization format
      x-consoleDefault: application/json
      schema:
        type: string
        enum:
        - json
        - xml
    get:
      tags:
      - HealthcareService
      responses:
        403:
          description: Access denied
        200:
          description: Success
          content:
            schema:
              $ref: '#/components/schemas/HealthcareService'
  /Location:
    get:
      tags:
      - Location
      responses:
        403:
          description: Access denied
        200:
          description: Success
          content:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Location'
      parameters:
      - name: _id
        in: query
        description: The ID of the Location Resource
        schema:
          type: string
      - name: name
        in: query
        description: Location name
        schema:
          type: string
      - name: address
        in: query
        description: First line of address as it appears in Healthpoint. E.g. 171 Cameron Rd
        schema:
          type: string
      - name: address-city
        in: query
        description: The town/city specified in an address, e.g. Ashburton
        schema:
          type: string
      - name: address-postalcode
        in: query
        description: A postal code specified in an address
        schema:
          type: string
      - name: _format
        in: query
        description: Serialization format
        x-consoleDefault: application/json
        schema:
          type: string
          enum:
          - json
          - xml
  /Location/{id}:
    parameters:
    - in: path
      required: true
      name: id
      schema:
        type: string
    get:
      tags:
      - Location
  /Practitioner:
    get:
      tags:
      - Practitioner
      parameters:
      - name: _id
        in: query
        description: The ID of the Practitioner resource
        schema:
          type: string
      - name: name
        in: query
        description: A server defined search that may match any of the string fields in the HumanName, including family, give, prefix, suffix, suffix, and/or text
        schema:
          type: string
      - name: given
        in: query
        description: A portion of the given name
        schema:
          type: string
      - name: family
        in: query
        description: A portion of the family name
        schema:
          type: string
      - name: gender
        in: query
        description: Gender (General Practitioner and Dentistry only)
        schema:
          type: string
          enum:
          - male
          - female
          - other
          - unknown
      - name: _format
        in: query
        description: Serialization format
        x-consoleDefault: application/json
        schema:
          type: string
          enum:
          - json
          - xml
      responses:
        200:
          description: Success
          content:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Practitioner'
  /Practitioner/{id}:
    parameters:
    - in: path
      required: true
      name: id
      schema:
        type: string
    get:
      tags:
      - Practitioner
      responses:
        200:
          description: Success
          content:
            schema:
              $ref: '#/components/schemas/Practitioner'
  /PractitionerRole:
