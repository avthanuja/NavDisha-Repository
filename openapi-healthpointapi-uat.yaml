components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Bundle:
      description: ""
      type: object
      properties:
        resourceType:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        meta:
          type: object
          properties:
            fhir_comments:
              type: array
              items:
                properties: {}
            lastUpdated:
              type: string
              minLength: 1
          required:
          - fhir_comments
          - lastUpdated
        type:
          type: string
          minLength: 1
        total:
          type: number
        _total:
          type: object
          properties:
            fhir_comments:
              type: array
              items:
                properties: {}
          required:
          - fhir_comments
        link:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            required:
            - relation
            - url
            properties:
              fhir_comments:
                type: array
                items:
                  properties: {}
              relation:
                type: string
                minLength: 1
              url:
                type: string
                minLength: 1
        entry:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            required:
            - fullUrl
            properties:
              fhir_comments:
                type: array
                items:
                  properties: {}
              fullUrl:
                type: string
                minLength: 1
              resource:
                type: object
                properties:
                  resourceType:
                    type: string
                    minLength: 1
                  id:
                    type: string
                    minLength: 1
                  text:
                    type: object
                    properties:
                      fhir_comments:
                        type: array
                        items:
                          properties: {}
                      status:
                        type: string
                        minLength: 1
                      div:
                        type: string
                        minLength: 1
                    required:
                    - fhir_comments
                    - status
                    - div
                  patient:
